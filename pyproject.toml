[project]
name = "marimo-notebook"
version = "0.1.0"
description = "Starter codebase to use Marimo reactive notebooks to build a reusable, customizable, Prompt Library."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "pytest>=8.3.3",
    "mako>=1.3.5",
    "pandas>=2.2.3",
    "altair>=5.4.1",
    "vega-datasets>=0.9.0",
    "pyperclip>=1.9.0",
    "matplotlib>=3.10.1",
    "pydantic>=2.10.6",
    "tornado>=6.4.2",
    "marimo>=0.11.16",
    "llm-claude-3>=0.11",
    "llm-gemini>=0.13.1",
    "llm-ollama>=0.9.0",
    "openai>=1.65.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
